<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="mao@lab: builds systems that have to be right - research infrastructure, agent orchestration, security research">
  <style>
    .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .dim{fill:#5b6478}.txt{fill:#c9d1e0}.acc{fill:#7ee7c4}.vio{fill:#b69cff}.warn{fill:#ffcf70}
    .l{animation:in .01s backwards}
    .l1{animation-delay:.3s}.l2{animation-delay:1.1s}.l3{animation-delay:1.6s}.l4{animation-delay:2.1s}.l5{animation-delay:2.6s}.l6{animation-delay:3.2s}
    @keyframes in{from{opacity:0}to{opacity:0}}
    .cur{animation:blink 1s steps(1) infinite 3.2s}
    @keyframes blink{50%{opacity:0}}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(300px)}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#b69cff"/><stop offset="1" stop-color="#7ee7c4"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="#1a2030" stroke-width="1"/></pattern>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ee7c4" stop-opacity="0"/><stop offset="1" stop-color="#7ee7c4" stop-opacity=".06"/></linearGradient>
  </defs>
  <rect width="1280" height="300" rx="14" fill="#0b0e14"/>
  <rect width="1280" height="300" rx="14" fill="url(#grid)"/>
  <rect class="scan" width="1280" height="40" fill="url(#sg)"/>
  <rect x=".5" y=".5" width="1279" height="299" rx="14" fill="none" stroke="#232a3a"/>
  <circle cx="28" cy="26" r="6" fill="#ff5f57"/><circle cx="48" cy="26" r="6" fill="#febc2e"/><circle cx="68" cy="26" r="6" fill="#28c840"/>
  <text x="640" y="31" text-anchor="middle" class="m dim" font-size="13">mao@lab: ~ — zsh — 120×30</text>
  <g class="m" font-size="20">
    <text x="40" y="84" class="l l1"><tspan class="acc">➜</tspan><tspan class="vio"> ~</tspan><tspan class="txt"> whoami</tspan></text>
    <text x="40" y="124" class="l l2" font-size="40" font-weight="700" fill="url(#g)">MAO — systems builder</text>
    <text x="40" y="164" class="l l3 txt"><tspan class="dim"># </tspan>research infrastructure · agent orchestration · security research · systems</text>
    <text x="40" y="200" class="l l4"><tspan class="acc">➜</tspan><tspan class="vio"> ~</tspan><tspan class="txt"> cat ./principles</tspan></text>
    <text x="40" y="232" class="l l5 txt">no look-ahead · replay == live · unlisted transitions stop and ask · <tspan class="warn">measure, then believe</tspan></text>
    <text x="40" y="270" class="l l6"><tspan class="acc">➜</tspan><tspan class="vio"> ~</tspan><tspan class="txt"> </tspan><tspan class="cur acc">█</tspan></text>
  </g>
  <g class="m" font-size="12" text-anchor="end">
    <text x="1244" y="244" class="dim">last 12 months</text>
    <text x="1244" y="266" class="acc">3,761 contributions · 236 active days</text>
  </g>
</svg>
