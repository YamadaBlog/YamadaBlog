name: forge
on:
  schedule: [{ cron: '17 3 * * *' }]
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: forge, cancel-in-progress: false }
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: render assets from live data
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: python scripts/forge.py
      - name: every svg must parse, and must read correctly with no animation
        run: |
          python - <<'PY'
          import glob, io, re, xml.dom.minidom as m
          def strip_kf(css):
              out, i = [], 0
              while i < len(css):
                  k = re.compile(r'@keyframes\s+[\w-]+\s*\{').search(css, i)
                  if not k:
                      out.append(css[i:]); break
                  out.append(css[i:k.start()])
                  j, d = k.end(), 1
                  while j < len(css) and d:
                      d += (css[j] == '{') - (css[j] == '}'); j += 1
                  i = j
              return ''.join(out)
          bad = []
          for f in sorted(glob.glob('assets/*.svg')):
              m.parse(f)                                   # well-formed XML
              s = strip_kf(io.open(f, encoding='utf-8').read())
              s = re.sub(r'animation[\w-]*\s*:[^;}"]*;?', '', s)
              m.parseString(s)                             # still valid without animation
              # a gauge must never rest on an empty arc
              if 'stroke-dashoffset="1"' in s:
                  bad.append(f)
          if bad:
              raise SystemExit('gauge rests empty without animation: ' + ', '.join(bad))
          print('svg ok:', len(glob.glob('assets/*.svg')), '| static state verified')
          PY
      - name: commit if anything moved
        run: |
          git config user.name  "forge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets site README.md data
          git diff --cached --quiet || { git commit -m "forge: re-render $(date -u +%F)"; git push; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: forge
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
