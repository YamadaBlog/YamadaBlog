name: forge
on:
  schedule: [{ cron: '17 3 * * *' }]
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: forge, cancel-in-progress: false }
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: render assets from live data
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: python scripts/forge.py
      - name: sanity-check every generated svg parses
        run: |
          python - <<'PY'
          import glob, xml.dom.minidom as m
          for f in sorted(glob.glob('assets/*.svg')):
              m.parse(f)
          print('all svg ok:', len(glob.glob('assets/*.svg')))
          PY
      - name: commit if anything moved
        run: |
          git config user.name  "forge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets site README.md data
          git diff --cached --quiet || { git commit -m "forge: re-render $(date -u +%F)"; git push; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: forge
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
